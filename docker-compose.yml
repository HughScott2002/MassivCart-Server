services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PORT: 8000
      # Container-reachable URL for the local Supabase stack on the host.
      # Using cloud Supabase in docker? Set COMPOSE_SUPABASE_URL in .env.
      SUPABASE_URL: ${COMPOSE_SUPABASE_URL:-http://host.docker.internal:54321}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
